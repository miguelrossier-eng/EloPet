<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stark OS - Home</title>
    <!-- Utiliza o mesmo arquivo de estilo base do projeto -->
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0f12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Cabeçalho e Navegação Superior */
        header {
            width: 100%;
            background-color: #0d0f12;
            border-bottom: 2px solid #ff0000;
            padding: 15px 40px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .header-container {
            display: flex;
            align-items: center;
            width: 100%;
            justify-content: space-between;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #a0a0a0;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        nav a.active {
            color: #ff0000;
            border-bottom: 2px solid #ff0000;
            padding-bottom: 4px;
        }

        /* Container Principal com Divisão em Duas Colunas */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: radial-gradient(circle, rgba(21,24,30,1) 0%, rgba(9,10,12,1) 100%);
        }

        /* Container que envelopa as colunas de conteúdo */
        .home-layout {
            display: flex;
            width: 100%;
            max-width: 1100px;
            gap: 40px;
            align-items: center;
            justify-content: space-between;
        }

        /* LADO ESQUERDO: Painel HUD Reduzido */
        .welcome-box {
            background-color: #15181e;
            border: 1.5px solid #e50914;
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.25);
            border-radius: 12px;
            padding: 35px;
            flex: 1;
            max-width: 500px; /* Ajustado menor para a esquerda */
            position: relative;
            text-align: left;
        }

        /* Detalhe Amarelo Superior no Box Esquerdo */
        .welcome-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 40px;
            width: 60px;
            height: 4px;
            background-color: #ffcc00;
            border-radius: 2px;
            box-shadow: 0 0 10px #ffcc00;
        }

        .welcome-box h1 {
            color: #ffcc00;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .welcome-box p {
            color: #a0a0a0;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-block;
            color: #00e5ff;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid #00e5ff;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            background-color: rgba(0, 229, 255, 0.05);
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
        }

        /* Botão de Direcionamento */
        .btn-chat-redirect {
            display: inline-block;
            width: 100%;
            background-color: #990000;
            color: #ffcc00;
            border: 1px solid #ff3333;
            border-radius: 6px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(153, 0, 0, 0.4);
        }

        .btn-chat-redirect:hover {
            background-color: #cc0000;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
        }

        /* LADO DIREITO: Container da Imagem HUD F.R.I.D.A.Y. */
        .image-box {
            flex: 1;
            max-width: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 50%; /* Mantém o formato circular do HUD */
            border: 2px solid rgba(255, 102, 0, 0.4); /* Brilho sutil laranja combinando com a imagem */
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.3);
            object-fit: cover;
        }

        /* Responsividade para telas menores (empilha os elementos) */
        @media (max-width: 850px) {
            .home-layout {
                flex-direction: column;
                gap: 40px;
            }
            .welcome-box, .image-box {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER / MENU DE NAVEGAÇÃO SUPERIOR -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <span class="highlight"></span>
            </div>
            <nav class="nav-links">
                <a href="index.html" class="active">HOME</a>
                <a href="cadastro.html">CADASTRO</a>
                <a href="login.html">LOGIN</a>
                <a href="chat.html">CHAT</a>
            </nav>
        </div>
    </header>

    <!-- CONTEÚDO CENTRAL DISTRIBUÍDO EM DUAS COLUNAS -->
    <main>
        <div class="home-layout">
            
            <!-- COLUNA ESQUERDA: Informações e Acesso -->
            <div class="welcome-box">
                <div class="status-badge">Sistemas de Defesa Operacionais</div>
                <h1>STARK OS</h1>
                <p>
                    Bem-vindo ao terminal central de comunicação da Torre Stark. 
                    Autentique suas credenciais de segurança e estabeleça conexão direta 
                    com o protocolo de inteligência artificial.
                </p>
                <a href="/chat.html" class="btn-chat-redirect">Inicializar Chat</a>
            </div>

            <!-- COLUNA DIREITA: Interface Gráfica da Inteligência Artificial F.R.I.D.A.Y. -->
            <div class="image-box">
                <img src="FRIDAY.jpg" alt="Interface HUD F.R.I.D.A.Y.">
            </div>

        </div>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Entrar</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0c0f12;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header.main-header {
      width: 100%;
      background-color: #0c0f12;
      border-bottom: 2px solid #a61212;
      padding: 15px 20px;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    nav.nav-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav.nav-links a {
      color: #7d848c;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    nav.nav-links a:hover {
      color: #ffffff;
    }

    nav.nav-links a.active {
      color: #e62429;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card-login {
      background-color: #11151d;
      border: 2px solid #b81414;
      border-radius: 12px;
      padding: 45px 35px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .card-login::before {
      content: '';
      position: absolute;
      top: -4px;
      right: 40px;
      width: 35px;
      height: 6px;
      background-color: #ffcc00;
      border-radius: 2px;
    }

    .card-login h2 {
      color: #ffcc00;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1.5px;
      margin-bottom: 35px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      color: #00bcd4;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .form-group input {
      width: 100%;
      background-color: #0a0d12;
      border: 1px solid #16222f;
      border-radius: 6px;
      padding: 14px 15px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #00bcd4;
    }

    .form-group input::placeholder {
      color: #38424d;
    }

    .caixa-resposta {
      background-color: rgba(13, 15, 18, 0.6);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 20px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    .btn-login {
      width: 100%;
      background-color: #990000;
      color: #ffcc00;
      border: 2px solid #ffcc00;
      border-radius: 6px;
      padding: 14px;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 15px;
    }

    .btn-login:hover:not(:disabled) {
      background-color: #ffcc00;
      color: #990000;
    }

    .btn-login:disabled {
      background-color: #333;
      border-color: #555;
      color: #777;
      cursor: not-allowed;
    }

    .links-footer {
      margin-top: 25px;
      text-align: center;
      font-size: 13px;
    }

    .links-footer a {
      color: #00bcd4;
      text-decoration: none;
      font-weight: bold;
    }

    .links-footer a:hover {
      text-decoration: underline;
    }

    /* ESTILO DO MODAL STARK HUD */
    .stark-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.25s ease;
    }

    .stark-modal-box {
      background: #11151d;
      border: 2px solid #b81414;
      box-shadow: 0 0 25px rgba(230, 36, 41, 0.45);
      border-radius: 12px;
      padding: 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      color: #fff;
      position: relative;
    }

    .stark-modal-box::before {
      content: '';
      position: absolute;
      top: -4px;
      right: 30px;
      width: 35px;
      height: 6px;
      background: #ffcc00;
      border-radius: 2px;
    }

    .stark-modal-title {
      color: #ffcc00;
      font-size: 20px;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .stark-modal-text {
      color: #cfd6e0;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .stark-modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn-stark-cadastro {
      background: #990000;
      color: #ffcc00;
      border: 2px solid #ffcc00;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
      font-size: 13px;
    }

    .btn-stark-cadastro:hover {
      background: #ffcc00;
      color: #990000;
    }

    .btn-stark-fechar {
      background: transparent;
      color: #8a94a6;
      border: 1px solid #333a45;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13px;
    }

    .btn-stark-fechar:hover {
      color: #fff;
      border-color: #8a94a6;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 600px) {
      header.main-header {
        padding: 15px 10px;
      }

      .header-container {
        justify-content: center;
      }

      nav.nav-links {
        gap: 12px;
        justify-content: center;
      }

      nav.nav-links a {
        font-size: 11px;
      }

      main {
        padding: 20px 15px;
      }

      .card-login {
        padding: 35px 20px;
      }

      .card-login h2 {
        font-size: 20px;
        margin-bottom: 25px;
      }
    }
  </style>
</head>

<body>

 <!-- HEADER / MENU DE NAVEGAÇÃO SUPERIOR -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <span class="highlight"></span>
            </div>
            <nav class="nav-links">
                <a href="home.html" class="active">HOME</a>
                <a href="index.html" class="active">GALERIA</a>
                <a href="cadastro.html" class="active">CADASTRO</a>
                <a href="login.html" class="active">LOGIN</a>
                <a href="chat.html" id="link-chat" class="classe-protegida">CHAT</a>
                <a href="perfil.html">PERFIL</a>
                <a href="/logout" id="btnSair">SAIR</a>
            </nav>
        </div>
    </header>


  <main>
    <div class="card-login">

      <h2>ENTRAR NA CONTA</h2>

      <form id="loginForm">

        <div class="form-group">
          <label for="identificador">E-MAIL OU USUÁRIO</label>
          <input
            type="text"
            id="identificador"
            name="identificador"
            placeholder="Digite seu e-mail ou usuário"
            required
          >
        </div>

        <div class="form-group">
          <label for="senha">SENHA</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            required
          >
        </div>

        <div
          id="statusSistema"
          class="caixa-resposta"
          style="display: none;"
        ></div>

        <button type="submit" id="btnEntrar" class="btn-login">
          ENTRAR
        </button>

        <div class="links-footer">
          <p style="color: #7d848c;">
            Ainda não tem conta?
            <a href="cadastro.html">Cadastre-se</a>
          </p>
        </div>

      </form>
    </div>
  </main>

  <!-- JANELA MODAL PERSONALIZADA -->
  <div id="modalStark" class="stark-modal-overlay">
    <div class="stark-modal-box">
      <h3 class="stark-modal-title">Acesso Restrito</h3>
      <p class="stark-modal-text">
        Protocolo de segurança ativado. Você precisa realizar seu <strong>cadastro</strong> antes de conversar com Tony Stark.
      </p>
      <div class="stark-modal-actions">
        <button id="btnFecharModal" class="btn-stark-fechar">Voltar</button>
        <a href="cadastro.html" class="btn-stark-cadastro">Fazer Cadastro</a>
      </div>
    </div>
  </div>

  <script>
    // 1. Intercepta clique no Chat caso não esteja logado
    document.addEventListener('DOMContentLoaded', () => {
      const linkChat = document.getElementById('link-chat');
      const modalStark = document.getElementById('modalStark');
      const btnFecharModal = document.getElementById('btnFecharModal');

      if (linkChat) {
        linkChat.addEventListener('click', async (evento) => {
          evento.preventDefault();

          try {
            const resposta = await fetch('/api/meu-usuario');
            const dados = await resposta.json();

            if (resposta.ok && dados.logado) {
              window.location.href = 'chat.html';
            } else {
              modalStark.style.display = 'flex';
            }
          } catch (erro) {
            modalStark.style.display = 'flex';
          }
        });
      }

      btnFecharModal.addEventListener('click', () => {
        modalStark.style.display = 'none';
      });

      modalStark.addEventListener('click', (e) => {
        if (e.target === modalStark) {
          modalStark.style.display = 'none';
        }
      });
    });

    // 2. Envio do formulário de login
    const form = document.getElementById('loginForm');
    const btnEntrar = document.getElementById('btnEntrar');
    const statusDiv = document.getElementById('statusSistema');

    form.addEventListener('submit', async function(event) {

      event.preventDefault();

      btnEntrar.disabled = true;

      statusDiv.style.display = 'block';
      statusDiv.style.borderColor = '#ffcc00';
      statusDiv.style.color = '#ffcc00';

      statusDiv.innerText =
        'Autenticando acesso aos servidores Stark...';

      const identificador =
        document.getElementById('identificador').value.trim();

      const senha =
        document.getElementById('senha').value;

      try {

        const resposta = await fetch('/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            identificador,
            senha
          })
        });

        const dados = await resposta.json();

        if (resposta.ok) {

          statusDiv.style.borderColor = '#00e676';
          statusDiv.style.color = '#00e676';

          statusDiv.innerText =
            'Conexão estabelecida! Abrindo canal seguro de comunicação...';

          form.reset();

          setTimeout(() => {
            window.location.href = '/chat.html';
          }, 1500);

        } else {

          statusDiv.style.borderColor = '#ff1a1a';
          statusDiv.style.color = '#ff1a1a';

          statusDiv.innerText =
            'Acesso negado: ' +
            (dados.erro || 'Verifique suas credenciais.');

          btnEntrar.disabled = false;
        }

      } catch (erro) {

        statusDiv.style.borderColor = '#ff1a1a';
        statusDiv.style.color = '#ff1a1a';

        statusDiv.innerText =
          'Falha crítica: Servidor Stark offline.';

        console.error('Erro no login:', erro);

        btnEntrar.disabled = false;
      }

    });
  </script>

  <script>
// Verificação de login: esconde Cadastro/Login e mostra Perfil/Sair
// Usa a sessão do servidor (rota /api/meu-usuario), a mesma que o seu login já usa.
(function () {
  const pagina = (location.pathname.split('/').pop() || 'index.html').toLowerCase();

  // Evita "piscar" os links errados enquanto o servidor responde
  const estilo = document.createElement('style');
  estilo.textContent =
    'nav a[href="cadastro.html"], nav a[href="login.html"], nav a[href="perfil.html"], #btnSair { visibility: hidden; }';
  document.head.appendChild(estilo);

  function aplicar(logado) {
    // Cadastro e Login somem para quem está logado; Perfil e Sair só aparecem para quem está logado
    const mostrar = (seletor, visivel) =>
      document.querySelectorAll(seletor).forEach((el) => {
        el.style.display = visivel ? '' : 'none';
        el.style.visibility = 'visible';
      });

    mostrar('nav a[href="cadastro.html"]', !logado);
    mostrar('nav a[href="login.html"]', !logado);
    mostrar('nav a[href="perfil.html"]', logado);
    mostrar('#btnSair', logado);

    // Só o link da página atual fica vermelho (hoje todos estão com class="active")
    document.querySelectorAll('nav a').forEach((a) => {
      a.classList.toggle('active', (a.getAttribute('href') || '').toLowerCase() === pagina);
    });
  }

  // Botão Sair: <a href="/logout" id="btnSair">Sair</a>
  const sair = document.getElementById('btnSair');
  if (sair) {
    sair.addEventListener('click', async (e) => {
      e.preventDefault();
      try { await fetch('/logout', { method: 'POST', credentials: 'same-origin' }); } catch (_) {}
      location.href = 'login.html';
    });
  }

  fetch('/api/meu-usuario', { credentials: 'same-origin' })
    .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      const logado = ok && !!d.logado;

      // Já logado e abriu cadastro/login -> vai direto para o perfil
      if (logado && (pagina === 'cadastro.html' || pagina === 'login.html')) {
        location.replace('perfil.html');
        return;
      }
      // Página protegida (<body data-protegida>) sem login -> volta para o login
      if (!logado && document.body.hasAttribute('data-protegida')) {
        location.replace('login.html');
        return;
      }
      aplicar(logado);
    })
    .catch(() => aplicar(false));
})();
</script>

</body>
</html>

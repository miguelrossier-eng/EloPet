<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chat com Stark</title>
    <!-- ESTA LINHA VAI VINCULAR O SEU CSS -->
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <!-- HEADER / MENU DE NAVEGAÇÃO SUPERIOR -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <span class="highlight"></span>
            </div>
            <!-- Centralização exata do menu de navegação -->
            <nav class="nav-links">
                <a href="home.html" class="active">HOME</a>
                <a href="index.html" class="active">GALERIA</a>
                <a href="cadastro.html" class="active">CADASTRO</a>
                <a href="login.html" class="active">LOGIN</a>
                <a href="chat.html" class="active">CHAT</a>

            </nav>
        </div>
    </header>


<div class="chatContainer">
    <h2 id="boasVindas">Seja bem vindo ao Chat da Stark Industries</h2>
    <div id="caixaChat"></div>

    <div id="inputArea">
        <input type="text" id="mensagem" placeholder="Digite sua mensagem para o Tony Stark">
        <button id="btnEnviar">Enviar</button>
    </div>
</div>

<script>
const usuarioLogado = 'miguel'

document.querySelector('#boasVindas').textContent = `Olá ${usuarioLogado}, seja bem-vindo`
const caixaChat = document.querySelector('#caixaChat')
const inputMensagem = document.querySelector('#mensagem')
const btnEnviar = document.querySelector('#btnEnviar')

const historicoConversa = []

function mensagemTela(autor, texto) {
    const textoFinal = document.createElement('p')
    textoFinal.className = 'msg'
    textoFinal.textContent = `${autor}: ${texto}`
    caixaChat.appendChild(textoFinal)
    
    // Rola o chat para baixo automaticamente
    caixaChat.scrollTop = caixaChat.scrollHeight 
}

btnEnviar.addEventListener('click', async () => {
    const textoMensagem = inputMensagem.value.trim()

    if (!textoMensagem) return

    // Exibe e salva a mensagem do usuário
    mensagemTela(usuarioLogado, textoMensagem)
    historicoConversa.push({ role: "user", content: textoMensagem })

    inputMensagem.value = ''
    btnEnviar.disabled = true

    try {
        // CORREÇÃO AQUI: Mudado de '/chat' para '/enviar-mensagem'
        const respostaServidor = await fetch('/enviar-mensagem', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                historico: historicoConversa,
                mensagem: textoMensagem 
            })
        })

        const dados = await respostaServidor.json()
        
        if (!respostaServidor.ok) {
            mensagemTela('Sistema', dados.erro || 'Erro desconhecido')
            return
        }

        // Exibe a resposta oficial do Tony Stark
        mensagemTela('Tony Stark', dados.resposta)
        
        // Salva a resposta no histórico
        historicoConversa.push({ role: "assistant", content: dados.resposta })

    }
    catch (erro) {
        mensagemTela('Sistema', 'Erro ao conectar com o servidor')
    }
    finally {
        btnEnviar.disabled = false
    }
})

// Permite enviar a mensagem apertando a tecla "Enter" do teclado
inputMensagem.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        btnEnviar.click()
    }
})
</script>

   
</body>
</html>
